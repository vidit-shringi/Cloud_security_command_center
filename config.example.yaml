### User Inko Download Karke Kaise Use Karega?
Jab koi naya user aapki repo download karega, toh wo apne terminal mein bas ye commands likhega:

**Linux / Mac par:**
```bash
cp .env.example .env
cp config.example.yaml config.yaml
```

**Windows par:**
```cmd
copy .env.example .env
copy config.example.yaml config.yaml
