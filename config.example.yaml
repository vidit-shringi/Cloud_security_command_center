# ==========================================
# INTERNSHIELD CSCC CONFIGURATION
# ==========================================
# Rename this file to 'config.yaml' to apply custom settings.

app:
  name: "InternShield CSCC"
  version: "1.0"
  log_level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL

aws:
  default_region: "us-east-1"
  max_retries: 3

ai:
  # Supported providers: shellgpt, openai, anthropic, gemini, local, disabled
  default_provider: "shellgpt"
  require_human_confirmation: true

reporting:
  output_dir: "reports"
  default_formats: 
    - json
    - html
```

